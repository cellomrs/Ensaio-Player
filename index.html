<template id="helpTpl">
<div class="help">
<div class="help-brand"><img src="img/logo-96.png" alt="" width="56" height="56"><p class="lead">O Ensaio toca seus arquivos de áudio, mostra a letra acompanhando a música e ajuda a repetir e desacelerar trechos. Tudo fica guardado só neste celular.</p></div>

<details id="installHelp"><summary>Instalar no celular</summary><div class="body">
<p>Instalado, o Ensaio ganha ícone na tela de início, abre em tela cheia e <b>funciona sem internet</b> (as músicas já ficam no aparelho).</p>
<div id="installBox"></div>
<h3>Android (Chrome)</h3>
<p>Toque em <b>Instalar o app</b> acima. Se o botão não aparecer, abra o menu <b>⋮</b> do Chrome e escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>
<h3>iPhone e iPad (Safari)</h3>
<p>Toque em <b>Compartilhar</b> (o quadrado com a seta para cima) e depois em <b>Adicionar à Tela de Início</b>. No iPhone, o app instalado também fica protegido da limpeza automática de dados do Safari.</p>
<p>As músicas e letras guardadas no navegador continuam valendo no app instalado, desde que seja o mesmo endereço.</p>
</div></details>

<details><summary>Primeiros passos</summary><div class="body">
<ol>
<li>Na aba <b>Músicas</b>, toque em <b>Adicionar músicas</b>.</li>
<li>Escolha um ou mais arquivos de áudio do celular.</li>
<li>Espere o aviso “Música adicionada”.</li>
<li>Toque no nome de uma música para começar a tocar.</li>
</ol>
<p>Trocou de celular? Toque em <b>Importar dados</b> antes de adicionar as músicas. Veja “Onde ficam seus dados”.</p>
<p>No menu <b>⋯</b> de cada música você pode renomear, editar a letra, adicionar observações, colocar numa playlist, exportar a letra ou excluir a música.</p>
<p>Embaixo de cada nome aparece a duração e a situação da letra: <i>sem letra</i>, <i>letra sem tempos</i> ou <i>letra sincronizada</i>.</p>
<h3>Buscar e navegar na lista</h3>
<ul>
<li><b>Busca:</b> digite parte do nome ou um trecho da letra. Maiúsculas e acentos não fazem diferença. Quando o trecho está só na letra, aparece o verso encontrado embaixo do nome.</li>
<li><b>Tocar a partir da busca:</b> a fila passa a ser só as músicas encontradas.</li>
<li><b>Páginas:</b> a lista mostra 10, 20 ou 50 músicas por vez (escolha em <b>Mostrar</b>). Use <b>Anterior</b> e <b>Próxima</b> para ver as outras.</li>
</ul>
</div></details>

<details><summary>Playlists</summary><div class="body">
<ol>
<li>Na aba <b>Playlists</b>, toque em <b>Nova playlist</b> e dê um nome.</li>
<li>Toque em <b>Escolher músicas</b> e marque as músicas. Elas entram na ordem em que você marca, e o número ao lado mostra a posição. A busca e as páginas ajudam a achar cada uma; o que você marcou continua marcado ao trocar de página ou de busca.</li>
<li>Ajuste a ordem com as setas. O <b>×</b> tira a música só da playlist, sem apagar do aparelho.</li>
<li>Toque em <b>Tocar playlist</b>, ou no nome de uma música para começar por ela.</li>
</ol>
<p>O botão <b>Opções</b> renomeia ou exclui a playlist. Excluir uma playlist não apaga as músicas.</p>
</div></details>

<details><summary>O player</summary><div class="body">
<p>A barra no rodapé mostra a música atual. Toque no nome para abrir o player; a seta no canto de cima fecha sem parar a música.</p>
<ul>
<li><b>Barra de posição:</b> arraste para ir a qualquer ponto.</li>
<li><b>Anterior:</b> volta ao começo; nos 3 primeiros segundos, vai para a música anterior.</li>
<li><b>−5s e +5s:</b> voltam ou avançam 5 segundos.</li>
<li><b>Próxima:</b> vai para a próxima da fila.</li>
<li><b>Letra</b> (canto de cima): editar ou exportar a letra.</li>
</ul>
<p>Ao terminar uma música, a próxima começa sozinha. Com o player aberto e a música tocando, a tela fica acesa. Os controles também aparecem na tela de bloqueio da maioria dos celulares.</p>
</div></details>

<details><summary>Letras e sincronização</summary><div class="body">
<p>Com a letra sincronizada, o verso atual fica destacado e a tela rola sozinha. Tocar num verso pula a música para ele.</p>
<h3>Adicionar a letra</h3>
<ol>
<li>No player, toque em <b>Letra</b> e em <b>Adicionar letra</b>.</li>
<li>Cole a letra com um verso por linha. Linhas em branco viram espaços entre as partes.</li>
<li>Toque em <b>Salvar letra</b>.</li>
</ol>
<h3>Sincronizar</h3>
<ol>
<li>Toque em <b>Sincronizar</b>. A primeira linha fica marcada com um traço amarelo.</li>
<li>Dê play.</li>
<li>Toque em <b>Marcar linha</b> no instante em que cada verso começa.</li>
<li>Errou? <b>Voltar linha</b> recua a música e você marca de novo.</li>
<li>Para recomeçar de um verso, toque nele durante a sincronização.</li>
<li>Ao marcar a última linha, tudo é salvo. Para parar antes e manter os tempos marcados, toque em <b>Concluir</b>. Para descartar as alterações desta tentativa, toque em <b>Cancelar</b>.</li>
</ol>
<p>O Ensaio desconta um pequeno atraso do toque, então não precisa adiantar.</p>
<h3>Corrigir um verso</h3>
<p>Para corrigir uma palavra, não precisa abrir a letra toda: no player, <b>segure o dedo sobre o verso</b> por meio segundo. Abre a janela <b>Editar verso</b>, com o texto e a anotação. O tempo do verso continua o mesmo. Ali também dá para apagar o verso, em <b>Apagar</b>.</p>
<h3>Ajustar tempos</h3>
<p>Para corrigir um verso que acende cedo ou tarde, sem sincronizar tudo de novo:</p>
<ol>
<li>Toque em <b>Sincronizar</b> e escolha <b>Ajustar tempos</b>. Também tem esse item em <b>Letra</b>.</li>
<li>Toque no verso que quer corrigir. Ele fica marcado com o traço amarelo.</li>
<li>Escolha o que mexer: <b>Este verso</b>, <b>Daqui em diante</b> (este e todos os seguintes) ou <b>Letra toda</b>.</li>
<li>Use <b>−10s −5s −1s</b> para o verso acender antes, ou <b>+1s +5s +10s</b> para acender depois. A cada toque a música volta 2 segundos antes do verso, para você conferir.</li>
<li>Toque em <b>Concluir</b> para salvar, ou <b>Cancelar</b> para voltar como estava.</li>
</ol>
<p>Em <b>Este verso</b>, o tempo não passa do verso anterior nem do seguinte, para a ordem não embaralhar.</p>
<h3>Importar .lrc</h3>
<p>No editor de letra, toque em <b>Importar .lrc</b> ou cole o conteúdo do arquivo. A letra já fica sincronizada. Dá para ajustar tempos à mão: cada linha começa com o tempo entre colchetes, como <code>[01:23.40]</code>.</p>
</div></details>

<details><summary>Ferramentas de ensaio</summary><div class="body">
<ul>
<li><b>Velocidade (1×):</b> de 0,5× a 1,25× sem mudar o tom. Fica amarelo quando não está na velocidade normal.</li>
<li><b>A–B:</b> toque no começo do trecho e em <b>Marcar B</b> no fim; o trecho repete até você tocar de novo para desligar. Os pontos aparecem na barra de posição.</li>
<li><b>Ao terminar (ícone ao lado do A–B):</b> escolha o que acontece quando a música acaba:
  <ul>
  <li><b>Pausar ao fim da música:</b> para e volta ao começo da mesma música. Bom para tocar uma vez e conversar com a banda.</li>
  <li><b>Seguir a fila até o fim:</b> passa para a próxima e para depois da última (é o padrão).</li>
  <li><b>Repetir esta música:</b> recomeça a mesma música sem parar, até você mudar.</li>
  <li><b>Repetir a fila toda:</b> depois da última, volta para a primeira. O botão Próxima na última música também volta para a primeira.</li>
  </ul>
  O ícone fica destacado quando não está no padrão, e a escolha fica guardada neste aparelho.</li>
<li><b>Sincronizar:</b> marca os tempos da letra. Se ela já tem tempos, também dá para ajustá-los com ±1s, ±5s e ±10s.</li>
<li><b>Aa:</b> alterna o tamanho da letra entre pequena, média e grande.</li>
</ul>
<p>A velocidade vale para todas as músicas até você mudar. O trecho A–B desliga ao trocar de música.</p>
<h3>Tema claro ou escuro</h3>
<p>Toque no círculo meio preenchido no alto da tela e escolha <b>Automático</b> (segue o tema do celular), <b>Claro</b> ou <b>Escuro</b>. O escuro cansa menos a vista em ensaio à noite ou no palco; o claro se lê melhor sob sol. A escolha fica guardada neste aparelho.</p>
</div></details>

<details><summary>Observações e anotações</summary><div class="body">
<h3>Observações da música</h3>
<p>Para tom, capotraste ou lembretes gerais, até 1000 caracteres. No player, toque na faixa abaixo do título, ou use o menu <b>⋯</b> da música. Para apagar, deixe o campo vazio e salve.</p>
<h3>Anotações nas linhas</h3>
<p>Para lembretes num verso exato, como “entra a segunda voz”, até 200 caracteres.</p>
<ul>
<li><b>Criar:</b> segure o dedo sobre um verso por meio segundo e escreva no campo <b>Anotação</b>.</li>
<li><b>Ver:</b> aparece embaixo do verso, com um traço amarelo.</li>
<li><b>Editar ou apagar:</b> segure o mesmo verso de novo. Para apagar, deixe o campo vazio e salve.</li>
</ul>
<p>Se você editar a letra, as anotações ficam nos versos que mantiverem o mesmo texto. As de versos alterados são removidas, com aviso.</p>
</div></details>

<details><summary>Exportar a letra</summary><div class="body">
<p>Em <b>Letra</b> no player ou no menu <b>⋯</b>, toque em <b>Exportar letra (.lrc)</b>:</p>
<ul>
<li><b>Compartilhar .lrc:</b> manda o arquivo pelo menu de compartilhar do celular. É o melhor caminho.</li>
<li><b>Baixar arquivo:</b> salva como <code>.lrc.txt</code>; renomeie tirando o “.txt”.</li>
<li><b>Copiar texto:</b> copia o conteúdo.</li>
</ul>
<p>Observações e anotações não vão no arquivo, porque o formato .lrc não tem lugar para elas.</p>
</div></details>

<details><summary>Onde ficam seus dados</summary><div class="body">
<p>Tudo fica no navegador deste celular e não aparece em outros aparelhos.</p>
<ul>
<li><b>Limpar os dados do navegador apaga tudo.</b> Faça antes um backup com <b>Exportar dados</b>.</li>
<li><b>No iPhone,</b> o Safari pode apagar dados de sites pouco usados. Instalar o Ensaio na tela de início evita isso.</li>
<li><b>O Ensaio guarda até 1 GB de áudio</b>, o que dá umas 100 a 200 músicas em MP3. Cada música ocupa o tamanho do arquivo original. No fim da aba <b>Músicas</b> aparece quanto já foi usado e quanto falta. Quando enche, exclua músicas que saíram do repertório; as letras podem ser guardadas antes com <b>Exportar dados</b>.</li>
</ul>
<h3>Exportar dados (backup)</h3>
<p>No fim da aba <b>Músicas</b>, toque em <b>Exportar dados</b>. Sai um arquivo <code>.json</code> pequeno com as letras e seus tempos, as observações, as anotações nos versos e as playlists. <b>Os áudios não vão junto</b>, para o arquivo continuar leve. Guarde no Drive, mande para você mesmo por mensagem ou e-mail.</p>
<h3>Importar dados</h3>
<ol>
<li>No outro celular (ou depois de limpar o navegador), toque em <b>Importar dados</b> e escolha o arquivo.</li>
<li>O Ensaio mostra o que vai acontecer antes de mudar qualquer coisa.</li>
<li>Músicas com o mesmo nome recebem a letra, as observações e as anotações do arquivo. O que elas tinham é substituído.</li>
<li>As que ainda não estão no aparelho ficam em <b>Esperando o áudio</b>. Adicione os áudios com os mesmos nomes de arquivo e cada letra entra sozinha, inclusive na playlist.</li>
</ol>
<p>O nome é comparado sem diferença de maiúsculas, acentos e “_”. Se o arquivo de áudio tiver outro nome, renomeie o arquivo antes de adicionar.</p>
</div></details>

<details><summary>Problemas comuns</summary><div class="body">
<h3>“Este formato de áudio não toca neste aparelho”</h3>
<p>Converta o arquivo para MP3 ou M4A.</p>
<h3>“Não coube no limite de 1 GB”</h3>
<p>O espaço do Ensaio está cheio. Exclua músicas que saíram do repertório (menu <b>⋯</b> → Excluir do aparelho) e adicione de novo.</p>
<h3>“Sem espaço para guardar”</h3>
<p>O próprio celular está sem espaço. Libere espaço no aparelho ou exclua músicas que saíram do repertório.</p>
<h3>“Armazenamento indisponível”</h3>
<p>O navegador está em modo anônimo ou bloqueando dados de sites. Abra numa janela normal.</p>
<h3>A letra não rola sozinha</h3>
<p>Ela ainda não tem tempos: use Sincronizar. Se já tem, espere alguns segundos depois de rolar com o dedo.</p>
<h3>O destaque chega antes ou depois do verso</h3>
<p>Use <b>Sincronizar → Ajustar tempos</b> e empurre o verso com os botões ±1s, ±5s ou ±10s. Se a letra toda está adiantada ou atrasada igual, escolha <b>Letra toda</b>.</p>
<h3>A tela apaga durante o ensaio</h3>
<p>Mantenha o player aberto com a música tocando. Se ainda apagar, aumente o tempo de bloqueio nas configurações do celular.</p>
<h3>Segurar o verso não abre a edição</h3>
<p>Segure o dedo parado, sem arrastar, por cerca de meio segundo.</p>
<h3>Não aparece “Compartilhar .lrc”</h3>
<p>O navegador não permite compartilhar arquivos daqui. Use Baixar arquivo ou Copiar texto.</p>
</div></details>
</div>
